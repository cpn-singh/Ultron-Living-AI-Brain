<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="1" />
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(244,63,94,0.3)" stroke-width="2" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="24 16" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8 12" opacity="0.4" />

  <!-- Hexagonal Core Matrix -->
  <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="rgba(15,23,42,0.8)" stroke="url(#ringGrad)" stroke-width="5" filter="url(#neonBlur)" />
  <polygon points="256,150 344,202 344,310 256,362 168,310 168,202" fill="none" stroke="rgba(244,63,94,0.5)" stroke-width="2" />

  <!-- Central Energy Core -->
  <circle cx="256" cy="256" r="85" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="38" fill="#f43f5e" filter="url(#neonBlur)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />

  <!-- Neural Radiating Lines -->
  <line x1="256" y1="120" x2="256" y2="218" stroke="#f43f5e" stroke-width="3" />
  <line x1="256" y1="294" x2="256" y2="392" stroke="#f43f5e" stroke-width="3" />
  <line x1="142" y1="186" x2="223" y2="236" stroke="#06b6d4" stroke-width="3" />
  <line x1="370" y1="326" x2="289" y2="276" stroke="#06b6d4" stroke-width="3" />
  <line x1="370" y1="186" x2="289" y2="236" stroke="#8b5cf6" stroke-width="3" />
  <line x1="142" y1="326" x2="223" y2="276" stroke="#8b5cf6" stroke-width="3" />

  <!-- Node Dots -->
  <circle cx="256" cy="120" r="8" fill="#06b6d4" />
  <circle cx="370" cy="186" r="8" fill="#f43f5e" />
  <circle cx="370" cy="326" r="8" fill="#8b5cf6" />
  <circle cx="256" cy="392" r="8" fill="#06b6d4" />
  <circle cx="142" cy="326" r="8" fill="#f43f5e" />
  <circle cx="142" cy="186" r="8" fill="#8b5cf6" />
</svg>
